version: 0.0
os: linux

files:
  - source: /
    destination: /usr/share/nginx/html
    overwrite: yes

permissions:
  - object: /usr/share/nginx/html
    pattern: "**"
    owner: nginx
    group: nginx
    mode: 755
    type:
      - file

hooks:
  ApplicationStart:
    - location: scripts/restart_nginx.sh
      timeout: 60
      runas: root
